      This static catalog/customer panel managed the old digit-serial
      `products` table directly. That table and its admin API
      (/api/admin/catalog, and the old shape of /api/admin/dashboard) were

      own JS (admin.js) would now just fail against endpoints that no
      longer exist. The unified, RBAC-gated admin app at /admin (materials,
      licenses, dashboard, live intelligence, audit log, admin accounts)
      supersedes it. Kept as a redirect, not deleted, so old bookmarks and
      any external links still land somewhere useful.
    -->
    <p>

    </p>
